<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <!-- App Background with squircle radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.4" />
  
  <!-- Journal Book Base -->
  <g transform="translate(64, 76)">
    <!-- Book spine shadow -->
    <rect x="24" y="24" width="336" height="344" rx="28" fill="#000000" opacity="0.35" />
    
    <!-- Book Cover -->
    <rect x="20" y="16" width="344" height="344" rx="28" fill="#1e293b" stroke="#334155" stroke-width="4" />
    
    <!-- Book Spine Ribs -->
    <line x1="68" y1="20" x2="68" y2="356" stroke="#0f172a" stroke-width="6" />
    <line x1="74" y1="20" x2="74" y2="356" stroke="#475569" stroke-width="2" />
    
    <!-- Book Pages Edge -->
    <rect x="350" y="28" width="16" height="320" rx="4" fill="#cbd5e1" opacity="0.8" />
    
    <!-- Code Bracket { } with Journal Lines inside -->
    <!-- Left curly brace -->
    <path d="M 160 110 C 135 110, 135 140, 135 160 C 135 178, 115 185, 105 188 C 115 191, 135 198, 135 216 C 135 236, 135 266, 160 266" 
          fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Right curly brace -->
    <path d="M 230 110 C 255 110, 255 140, 255 160 C 255 178, 275 185, 285 188 C 275 191, 255 198, 255 216 C 255 236, 255 266, 230 266" 
          fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
          
    <!-- Journal Lines / Heatmap grid representation inside book -->
    <!-- Heatmap mini squares -->
    <rect x="156" y="152" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="180" y="152" width="18" height="18" rx="4" fill="#047857" />
    <rect x="204" y="152" width="18" height="18" rx="4" fill="#34d399" />
    
    <rect x="156" y="176" width="18" height="18" rx="4" fill="#065f46" />
    <rect x="180" y="176" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="204" y="176" width="18" height="18" rx="4" fill="#10b981" />

    <rect x="156" y="200" width="18" height="18" rx="4" fill="#34d399" />
    <rect x="180" y="200" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="204" y="200" width="18" height="18" rx="4" fill="#059669" />

    <!-- Bookmark ribbon hanging down -->
    <path d="M 270 16 L 270 96 L 285 82 L 300 96 L 300 16 Z" fill="url(#glowGrad)" />
  </g>

  <!-- Solved Badge (check circle with fire glow) -->
  <g transform="translate(340, 340)">
    <circle cx="48" cy="48" r="54" fill="#0f172a" />
    <circle cx="48" cy="48" r="46" fill="url(#accentGrad)" />
    <!-- Checkmark -->
    <path d="M 32 48 L 44 60 L 66 36" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
