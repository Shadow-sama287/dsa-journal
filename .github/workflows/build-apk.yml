name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies & Build Bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Copy Web Bundle into Android Assets
        run: |
          rm -rf android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/assets
          cp -r dist/* android-project/app/src/main/assets/
          rm -rf android-project/app/src/main/assets/assets/aistudio

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Debug APK
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy Built APK to public/dsa-journal.apk
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk public/dsa-journal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSA-Journal-Android-APK
          path: public/dsa-journal.apk
          if-no-files-found: error

      - name: Commit Built APK to Repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/dsa-journal.apk
          git diff --staged --quiet || (git commit -m "chore: update compiled Android APK [skip ci]" && git push) || true
