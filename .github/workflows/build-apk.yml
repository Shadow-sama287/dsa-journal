name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies & Build Bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Copy Web Bundle into Android Assets
        run: |
          rm -rf android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/assets
          cp -r dist/* android-project/app/src/main/assets/
          rm -rf android-project/app/src/main/assets/assets/aistudio

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Debug APK
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare dsa-journal.apk
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk dsa-journal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSA-Journal-Android-APK
          path: dsa-journal.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DSA Journal Android APK (v1.0.${{ github.run_number }})"
          body: |
            Automated Android APK build from commit `${{ github.sha }}`.

            ### Installation
            Download **`dsa-journal.apk`** below under **Assets** and open it on your Android device to install.
          files: dsa-journal.apk
          draft: false
          prerelease: false
          make_latest: "true"
